<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MCP or script decision map</title>
  <desc id="desc">A decision map for choosing between a one-off script, a shared API wrapper, and an MCP server.</desc>
  <rect width="1200" height="620" rx="32" fill="#f7faf8"/>
  <rect x="54" y="56" width="1092" height="508" rx="28" fill="#ffffff" stroke="#d9e2dc" stroke-width="2"/>
  <text x="92" y="112" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18231f">从脚本到 MCP 的判断路径</text>
  <text x="92" y="152" font-family="Arial, sans-serif" font-size="18" fill="#57645f">复用范围、权限边界、客户端数量和可观测性决定抽象层级</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#22302b">
    <rect x="92" y="218" width="230" height="170" rx="18" fill="#eff7f2" stroke="#8cc7a3" stroke-width="2"/>
    <text x="122" y="258" font-size="24" font-weight="700">一次性脚本</text>
    <text x="122" y="300">单人、低频、低权限</text>
    <text x="122" y="332">日志可简单</text>
    <text x="122" y="364">失败可人工重跑</text>
    <rect x="485" y="218" width="230" height="170" rx="18" fill="#eef6fb" stroke="#7eb6d9" stroke-width="2"/>
    <text x="515" y="258" font-size="24" font-weight="700">共享封装</text>
    <text x="515" y="300">多人复用</text>
    <text x="515" y="332">输入输出稳定</text>
    <text x="515" y="364">需要测试和版本</text>
    <rect x="878" y="218" width="230" height="170" rx="18" fill="#fff6df" stroke="#e4b84e" stroke-width="2"/>
    <text x="908" y="258" font-size="24" font-weight="700">MCP Server</text>
    <text x="908" y="300">多客户端发现</text>
    <text x="908" y="332">权限和认证清晰</text>
    <text x="908" y="364">工具需可审计</text>
  </g>
  <path d="M335 303 H463" stroke="#6d7a75" stroke-width="4" stroke-linecap="round"/>
  <path d="M450 288 L472 303 L450 318" fill="none" stroke="#6d7a75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M728 303 H856" stroke="#6d7a75" stroke-width="4" stroke-linecap="round"/>
  <path d="M843 288 L865 303 L843 318" fill="none" stroke="#6d7a75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="110" y="448" width="980" height="64" rx="16" fill="#18231f"/>
    <text x="140" y="488" fill="#ffffff">升级信号：同一能力被多个 Agent 调用、需要最小权限、要记录请求结果、要让不同客户端自动发现。</text>
  </g>
</svg>
