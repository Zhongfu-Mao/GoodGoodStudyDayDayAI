<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FastAPI service split and observability architecture</title>
  <desc id="desc">A cloud architecture diagram showing a FastAPI container, worker queue, model gateway, storage, and OpenTelemetry collector.</desc>
  <rect width="1200" height="720" fill="#f8f5ee"/>
  <defs>
    <marker id="arrow6" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4b8b7e"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="70" y="68" font-size="34" font-weight="700" fill="#253238">FastAPI 云上架构：先模块化，再按运行时压力拆服务</text>
    <g font-size="17" fill="#253238">
      <rect x="70" y="165" width="170" height="90" rx="15" fill="#fff" stroke="#73817f"/><text x="155" y="216" text-anchor="middle">Client / UI</text>
      <rect x="300" y="150" width="210" height="120" rx="15" fill="#edf8f7" stroke="#49a9a2" stroke-width="2"/><text x="405" y="203" text-anchor="middle" font-weight="700">FastAPI API</text><text x="405" y="232" text-anchor="middle" fill="#60706f">control plane</text>
      <rect x="575" y="130" width="190" height="85" rx="15" fill="#fff8dc" stroke="#d2a53a" stroke-width="2"/><text x="670" y="181" text-anchor="middle">Queue</text>
      <rect x="830" y="130" width="220" height="85" rx="15" fill="#fff8dc" stroke="#d2a53a" stroke-width="2"/><text x="940" y="181" text-anchor="middle">Worker</text>
      <rect x="575" y="275" width="190" height="90" rx="15" fill="#fff" stroke="#82a868"/><text x="670" y="328" text-anchor="middle">Database</text>
      <rect x="830" y="275" width="220" height="90" rx="15" fill="#fff" stroke="#82a868"/><text x="940" y="328" text-anchor="middle">Object / Vector Store</text>
      <rect x="575" y="430" width="190" height="90" rx="15" fill="#fff" stroke="#73817f"/><text x="670" y="483" text-anchor="middle">Model Gateway</text>
      <rect x="830" y="430" width="220" height="90" rx="15" fill="#fff" stroke="#73817f"/><text x="940" y="483" text-anchor="middle">Tool Services</text>
      <rect x="300" y="500" width="260" height="100" rx="15" fill="#eef6ee" stroke="#82a868" stroke-width="2"/><text x="430" y="545" text-anchor="middle" font-weight="700">OpenTelemetry</text><text x="430" y="574" text-anchor="middle" fill="#60706f">logs / metrics / traces</text>
    </g>
    <g stroke="#4b8b7e" stroke-width="3" marker-end="url(#arrow6)">
      <line x1="240" y1="210" x2="300" y2="210"/>
      <line x1="510" y1="190" x2="575" y2="172"/>
      <line x1="765" y1="172" x2="830" y2="172"/>
      <line x1="510" y1="230" x2="575" y2="320"/>
      <line x1="510" y1="250" x2="830" y2="320"/>
      <line x1="510" y1="260" x2="575" y2="475"/>
      <line x1="765" y1="475" x2="830" y2="475"/>
      <path d="M405 270 C405 350 430 420 430 500" fill="none"/>
      <path d="M940 520 C880 610 560 610 505 600" fill="none"/>
    </g>
  </g>
</svg>
