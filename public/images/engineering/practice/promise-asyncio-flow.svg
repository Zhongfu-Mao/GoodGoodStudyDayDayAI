<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Promise and asyncio flow comparison</title>
  <desc id="desc">A comparison of JavaScript Promise scheduling and Python asyncio coroutine and task scheduling.</desc>
  <rect width="1200" height="640" fill="#f9f6ef"/>
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4b8b7e"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="70" y="70" font-size="34" font-weight="700" fill="#253238">Promise vs asyncio：相似的 await，不同的调度心智</text>
    <g transform="translate(70 125)">
      <rect width="500" height="420" rx="16" fill="#f0f7ec" stroke="#8ab55f" stroke-width="2"/>
      <text x="28" y="48" font-size="27" font-weight="700" fill="#24332c">JavaScript Promise</text>
      <circle cx="90" cy="125" r="34" fill="#cfe9b5"/>
      <text x="90" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#26332d">call</text>
      <line x1="124" y1="125" x2="210" y2="125" stroke="#4b8b7e" stroke-width="3" marker-end="url(#arrow2)"/>
      <rect x="218" y="92" width="180" height="66" rx="12" fill="#fff" stroke="#8ab55f"/>
      <text x="308" y="133" text-anchor="middle" font-size="18" fill="#26332d">Promise</text>
      <line x1="308" y1="158" x2="308" y2="245" stroke="#4b8b7e" stroke-width="3" marker-end="url(#arrow2)"/>
      <rect x="185" y="250" width="246" height="70" rx="12" fill="#fff8db" stroke="#d2a53a"/>
      <text x="308" y="292" text-anchor="middle" font-size="18" fill="#26332d">await / Promise.all</text>
      <text x="35" y="375" font-size="17" fill="#586765">异步函数调用后拿到 Promise；并发常用 Promise.all 组合。</text>
    </g>
    <g transform="translate(630 125)">
      <rect width="500" height="420" rx="16" fill="#edf8f7" stroke="#49a9a2" stroke-width="2"/>
      <text x="28" y="48" font-size="27" font-weight="700" fill="#25333a">Python asyncio</text>
      <circle cx="90" cy="125" r="34" fill="#bde7e3"/>
      <text x="90" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#26333a">call</text>
      <line x1="124" y1="125" x2="210" y2="125" stroke="#4b8b7e" stroke-width="3" marker-end="url(#arrow2)"/>
      <rect x="218" y="92" width="180" height="66" rx="12" fill="#fff" stroke="#49a9a2"/>
      <text x="308" y="133" text-anchor="middle" font-size="18" fill="#26333a">coroutine</text>
      <line x1="308" y1="158" x2="308" y2="245" stroke="#4b8b7e" stroke-width="3" marker-end="url(#arrow2)"/>
      <rect x="175" y="250" width="266" height="70" rx="12" fill="#fff8db" stroke="#d2a53a"/>
      <text x="308" y="280" text-anchor="middle" font-size="18" fill="#26333a">await / create_task</text>
      <text x="308" y="304" text-anchor="middle" font-size="16" fill="#586765">gather for concurrency</text>
      <text x="35" y="375" font-size="17" fill="#586765">coroutine 只是可等待对象；要 await 或显式调度成 task。</text>
    </g>
  </g>
</svg>
