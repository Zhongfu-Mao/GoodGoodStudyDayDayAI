<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Decorator type hint async cheatsheet</title>
  <desc id="desc">A beginner cheat sheet explaining decorators, type hints, Pydantic models, and async functions in FastAPI.</desc>
  <rect width="1200" height="620" fill="#f8f5ee"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="70" y="70" font-size="34" font-weight="700" fill="#253238">FastAPI 代码速查：先认这 4 个形状</text>
    <g transform="translate(70 135)">
      <rect width="250" height="330" rx="16" fill="#edf8f7" stroke="#49a9a2" stroke-width="2"/>
      <text x="125" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#253238">Decorator</text>
      <text x="125" y="105" text-anchor="middle" font-size="17" fill="#60706f">@app.get(...)</text>
      <text x="125" y="140" text-anchor="middle" font-size="17" fill="#60706f">把 URL 绑定到函数</text>
      <rect x="45" y="190" width="160" height="70" rx="10" fill="#fff" stroke="#49a9a2"/>
      <text x="125" y="233" text-anchor="middle" font-size="18" fill="#253238">GET /health</text>
    </g>
    <g transform="translate(345 135)">
      <rect width="250" height="330" rx="16" fill="#fff8dc" stroke="#d2a53a" stroke-width="2"/>
      <text x="125" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#253238">Type hints</text>
      <text x="125" y="105" text-anchor="middle" font-size="17" fill="#60706f">user_id: str</text>
      <text x="125" y="140" text-anchor="middle" font-size="17" fill="#60706f">limit: int = 20</text>
      <rect x="45" y="190" width="160" height="70" rx="10" fill="#fff" stroke="#d2a53a"/>
      <text x="125" y="233" text-anchor="middle" font-size="18" fill="#253238">解析 + 校验</text>
    </g>
    <g transform="translate(620 135)">
      <rect width="250" height="330" rx="16" fill="#eef6ee" stroke="#82a868" stroke-width="2"/>
      <text x="125" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#253238">Pydantic</text>
      <text x="125" y="105" text-anchor="middle" font-size="17" fill="#60706f">BaseModel</text>
      <text x="125" y="140" text-anchor="middle" font-size="17" fill="#60706f">给 JSON 定形状</text>
      <rect x="45" y="190" width="160" height="70" rx="10" fill="#fff" stroke="#82a868"/>
      <text x="125" y="233" text-anchor="middle" font-size="18" fill="#253238">body schema</text>
    </g>
    <g transform="translate(895 135)">
      <rect width="235" height="330" rx="16" fill="#fff" stroke="#73817f" stroke-width="2"/>
      <text x="118" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#253238">async def</text>
      <text x="118" y="105" text-anchor="middle" font-size="17" fill="#60706f">await I/O</text>
      <text x="118" y="140" text-anchor="middle" font-size="17" fill="#60706f">等待时让出执行权</text>
      <rect x="38" y="190" width="160" height="70" rx="10" fill="#fff8dc" stroke="#d2a53a"/>
      <text x="118" y="233" text-anchor="middle" font-size="18" fill="#253238">event loop</text>
    </g>
  </g>
</svg>
