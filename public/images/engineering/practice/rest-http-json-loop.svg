<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">REST HTTP JSON loop</title>
  <desc id="desc">A beginner friendly loop from client request to FastAPI function, validation, Python code, JSON response, and API documentation.</desc>
  <rect width="1200" height="650" fill="#fbf7ef"/>
  <defs>
    <marker id="arrow5" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4b8b7e"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="70" y="70" font-size="34" font-weight="700" fill="#253238">一条 API 请求如何流过 FastAPI</text>
    <g font-size="19" fill="#253238">
      <rect x="70" y="170" width="190" height="105" rx="18" fill="#fff" stroke="#73817f"/>
      <text x="165" y="215" text-anchor="middle" font-weight="700">Client</text>
      <text x="165" y="244" text-anchor="middle" fill="#60706f">HTTP request</text>
      <rect x="330" y="150" width="210" height="145" rx="18" fill="#edf8f7" stroke="#49a9a2" stroke-width="2"/>
      <text x="435" y="204" text-anchor="middle" font-weight="700">Route</text>
      <text x="435" y="234" text-anchor="middle" fill="#60706f">method + path</text>
      <text x="435" y="262" text-anchor="middle" fill="#60706f">query / body</text>
      <rect x="610" y="150" width="210" height="145" rx="18" fill="#fff8dc" stroke="#d2a53a" stroke-width="2"/>
      <text x="715" y="204" text-anchor="middle" font-weight="700">Validation</text>
      <text x="715" y="234" text-anchor="middle" fill="#60706f">type hints</text>
      <text x="715" y="262" text-anchor="middle" fill="#60706f">Pydantic model</text>
      <rect x="890" y="170" width="220" height="105" rx="18" fill="#eef6ee" stroke="#82a868" stroke-width="2"/>
      <text x="1000" y="215" text-anchor="middle" font-weight="700">Python function</text>
      <text x="1000" y="244" text-anchor="middle" fill="#60706f">business logic</text>
      <rect x="610" y="400" width="210" height="105" rx="18" fill="#fff" stroke="#73817f"/>
      <text x="715" y="445" text-anchor="middle" font-weight="700">JSON response</text>
      <text x="715" y="474" text-anchor="middle" fill="#60706f">serialized result</text>
      <rect x="330" y="400" width="210" height="105" rx="18" fill="#fff" stroke="#73817f"/>
      <text x="435" y="445" text-anchor="middle" font-weight="700">Docs</text>
      <text x="435" y="474" text-anchor="middle" fill="#60706f">OpenAPI / Swagger</text>
    </g>
    <g stroke="#4b8b7e" stroke-width="3" marker-end="url(#arrow5)">
      <line x1="260" y1="222" x2="330" y2="222"/>
      <line x1="540" y1="222" x2="610" y2="222"/>
      <line x1="820" y1="222" x2="890" y2="222"/>
      <path d="M1000 275 C1000 365 800 360 760 400" fill="none"/>
      <line x1="610" y1="452" x2="540" y2="452"/>
      <path d="M330 452 C230 450 165 370 165 275" fill="none"/>
    </g>
  </g>
</svg>
