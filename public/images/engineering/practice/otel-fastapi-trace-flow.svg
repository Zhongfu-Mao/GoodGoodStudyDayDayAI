<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">OpenTelemetry trace flow for FastAPI and agent services</title>
  <desc id="desc">A trace waterfall from HTTP request through dependency resolution, agent run, model call, tool call, and persistence.</desc>
  <rect width="1200" height="650" fill="#f8f5ee"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="70" y="70" font-size="34" font-weight="700" fill="#253238">OpenTelemetry：HTTP span 之外，还要补业务 span</text>
    <g transform="translate(90 135)">
      <rect width="1020" height="430" rx="18" fill="#fff" stroke="#d7d2c8"/>
      <g font-size="16" fill="#253238">
        <text x="35" y="55" font-weight="700">Trace waterfall</text>
        <rect x="35" y="85" width="910" height="36" rx="8" fill="#edf8f7" stroke="#49a9a2"/>
        <text x="55" y="109">POST /agent/runs</text>
        <rect x="95" y="145" width="260" height="34" rx="8" fill="#fff8dc" stroke="#d2a53a"/>
        <text x="115" y="168">resolve_user</text>
        <rect x="380" y="145" width="250" height="34" rx="8" fill="#fff8dc" stroke="#d2a53a"/>
        <text x="400" y="168">resolve_policy</text>
        <rect x="95" y="210" width="320" height="34" rx="8" fill="#eef6ee" stroke="#82a868"/>
        <text x="115" y="233">create_agent_run</text>
        <rect x="440" y="210" width="360" height="34" rx="8" fill="#eef6ee" stroke="#82a868"/>
        <text x="460" y="233">model_call: planner</text>
        <rect x="180" y="275" width="330" height="34" rx="8" fill="#f0f0f0" stroke="#73817f"/>
        <text x="200" y="298">tool_call: search_docs</text>
        <rect x="540" y="275" width="315" height="34" rx="8" fill="#f0f0f0" stroke="#73817f"/>
        <text x="560" y="298">model_call: final_answer</text>
        <rect x="710" y="340" width="235" height="34" rx="8" fill="#edf8f7" stroke="#49a9a2"/>
        <text x="730" y="363">persist_result</text>
      </g>
      <line x1="35" y1="405" x2="945" y2="405" stroke="#d7d2c8" stroke-width="2"/>
      <text x="35" y="445" font-size="16" fill="#60706f">自动 instrumentation 负责 HTTP；Agent 内部的 model/tool/retry/approval 需要手动建模。</text>
    </g>
  </g>
</svg>
