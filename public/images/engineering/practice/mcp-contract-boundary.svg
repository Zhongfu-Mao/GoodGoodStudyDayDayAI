<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">MCP tool contract boundary</title>
  <desc id="desc">A diagram showing an agent, tool contract, permission gate, and external systems.</desc>
  <rect width="1200" height="700" fill="#f6f4ef"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#253238">
    <text x="80" y="78" font-size="34" font-weight="700">MCP Tool Contract 的边界</text>
    <g transform="translate(80 170)">
      <rect width="250" height="340" rx="16" fill="#e8f1ed" stroke="#4c8f7a" stroke-width="2"/>
      <text x="40" y="70" font-size="26" font-weight="700">Agent</text>
      <text x="40" y="120" font-size="18">只看到工具说明</text>
      <text x="40" y="154" font-size="18">不直接碰系统</text>
      <text x="40" y="188" font-size="18">按 schema 请求</text>
    </g>
    <path d="M350 340 H500" stroke="#52605f" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(500 130)">
      <rect width="280" height="430" rx="16" fill="#fff8e7" stroke="#c9982e" stroke-width="2"/>
      <text x="32" y="60" font-size="25" font-weight="700">Tool Contract</text>
      <text x="32" y="112" font-size="18">name / description</text>
      <text x="32" y="154" font-size="18">input schema</text>
      <text x="32" y="196" font-size="18">structured output</text>
      <text x="32" y="238" font-size="18">error taxonomy</text>
      <text x="32" y="280" font-size="18">rate / cost hint</text>
      <text x="32" y="322" font-size="18">permission level</text>
      <text x="32" y="364" font-size="18">audit fields</text>
    </g>
    <path d="M800 340 H930" stroke="#52605f" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(930 170)">
      <rect width="190" height="340" rx="16" fill="#eaf0f7" stroke="#5b7896" stroke-width="2"/>
      <text x="30" y="70" font-size="25" font-weight="700">Systems</text>
      <text x="30" y="120" font-size="18">files</text>
      <text x="30" y="154" font-size="18">APIs</text>
      <text x="30" y="188" font-size="18">mail</text>
      <text x="30" y="222" font-size="18">calendar</text>
      <text x="30" y="256" font-size="18">database</text>
    </g>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52605f"/>
    </marker>
  </defs>
</svg>
