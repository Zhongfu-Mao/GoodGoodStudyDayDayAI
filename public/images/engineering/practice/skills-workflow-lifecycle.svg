<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Skill workflow lifecycle</title>
  <desc id="desc">A lifecycle from repeated failure to reusable skill.</desc>
  <rect width="1200" height="700" fill="#f7f4ee"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#253238">
    <text x="80" y="78" font-size="34" font-weight="700">从一次失败到可复用 Skill</text>
    <g transform="translate(95 185)">
      <circle cx="70" cy="70" r="62" fill="#f5ece8" stroke="#b56f4b" stroke-width="2"/>
      <text x="35" y="64" font-size="20" font-weight="700">失败</text>
      <text x="27" y="92" font-size="16">Failure</text>
    </g>
    <g transform="translate(300 185)">
      <circle cx="70" cy="70" r="62" fill="#fff8e7" stroke="#c9982e" stroke-width="2"/>
      <text x="30" y="64" font-size="20" font-weight="700">规则</text>
      <text x="18" y="92" font-size="16">Boundary</text>
    </g>
    <g transform="translate(505 185)">
      <circle cx="70" cy="70" r="62" fill="#e8f1ed" stroke="#4c8f7a" stroke-width="2"/>
      <text x="30" y="64" font-size="20" font-weight="700">步骤</text>
      <text x="17" y="92" font-size="16">Procedure</text>
    </g>
    <g transform="translate(710 185)">
      <circle cx="70" cy="70" r="62" fill="#eaf0f7" stroke="#5b7896" stroke-width="2"/>
      <text x="30" y="64" font-size="20" font-weight="700">脚本</text>
      <text x="30" y="92" font-size="16">Script</text>
    </g>
    <g transform="translate(915 185)">
      <circle cx="70" cy="70" r="62" fill="#eef1f3" stroke="#69767b" stroke-width="2"/>
      <text x="30" y="64" font-size="20" font-weight="700">验证</text>
      <text x="20" y="92" font-size="16">Validate</text>
    </g>
    <path d="M235 255 H298 M440 255 H503 M645 255 H708 M850 255 H913" stroke="#52605f" stroke-width="4"/>
    <g transform="translate(150 430)">
      <rect width="900" height="120" rx="16" fill="#ffffff" stroke="#d5d0c8" stroke-width="2"/>
      <text x="32" y="48" font-size="22" font-weight="700">Skill = 触发条件 + 操作步骤 + 边界 + 参考资料 + 可运行验证</text>
      <text x="32" y="86" font-size="18" fill="#52605f">好的 Skill 让 Agent 少猜一点，让团队多复用一点。</text>
    </g>
  </g>
</svg>
