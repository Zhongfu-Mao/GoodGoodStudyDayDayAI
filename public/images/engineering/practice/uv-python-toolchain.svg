<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">uv Python toolchain map</title>
  <desc id="desc">uv unifies Python versions, projects, dependencies, lockfiles, virtual environments, scripts, tools, and CI.</desc>
  <rect width="1200" height="720" fill="#f8f5ee"/>
  <defs>
    <marker id="arrow7" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4b8b7e"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="70" y="70" font-size="34" font-weight="700" fill="#253238">uv 的心智模型：把 Python 工程工作流收束到一个入口</text>
    <circle cx="600" cy="365" r="100" fill="#edf8f7" stroke="#49a9a2" stroke-width="3"/>
    <text x="600" y="355" text-anchor="middle" font-size="42" font-weight="800" fill="#253238">uv</text>
    <text x="600" y="390" text-anchor="middle" font-size="17" fill="#60706f">run / sync / lock / tool</text>
    <g font-size="18" fill="#253238">
      <rect x="80" y="150" width="220" height="88" rx="16" fill="#fff" stroke="#82a868"/><text x="190" y="186" text-anchor="middle" font-weight="700">Python versions</text><text x="190" y="214" text-anchor="middle" fill="#60706f">install / pin</text>
      <rect x="80" y="315" width="220" height="88" rx="16" fill="#fff" stroke="#82a868"/><text x="190" y="351" text-anchor="middle" font-weight="700">pyproject.toml</text><text x="190" y="379" text-anchor="middle" fill="#60706f">project metadata</text>
      <rect x="80" y="480" width="220" height="88" rx="16" fill="#fff" stroke="#82a868"/><text x="190" y="516" text-anchor="middle" font-weight="700">uv.lock</text><text x="190" y="544" text-anchor="middle" fill="#60706f">reproducible env</text>
      <rect x="900" y="150" width="220" height="88" rx="16" fill="#fff8dc" stroke="#d2a53a"/><text x="1010" y="186" text-anchor="middle" font-weight="700">.venv</text><text x="1010" y="214" text-anchor="middle" fill="#60706f">local runtime</text>
      <rect x="900" y="315" width="220" height="88" rx="16" fill="#fff8dc" stroke="#d2a53a"/><text x="1010" y="351" text-anchor="middle" font-weight="700">Scripts</text><text x="1010" y="379" text-anchor="middle" fill="#60706f">uv run</text>
      <rect x="900" y="480" width="220" height="88" rx="16" fill="#fff8dc" stroke="#d2a53a"/><text x="1010" y="516" text-anchor="middle" font-weight="700">Tools / CI</text><text x="1010" y="544" text-anchor="middle" fill="#60706f">uvx / sync</text>
    </g>
    <g stroke="#4b8b7e" stroke-width="3" marker-end="url(#arrow7)">
      <line x1="300" y1="194" x2="515" y2="315"/>
      <line x1="300" y1="359" x2="500" y2="365"/>
      <line x1="300" y1="524" x2="515" y2="415"/>
      <line x1="685" y1="315" x2="900" y2="194"/>
      <line x1="700" y1="365" x2="900" y2="359"/>
      <line x1="685" y1="415" x2="900" y2="524"/>
    </g>
  </g>
</svg>
