<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FastAPI agent request context architecture</title>
  <desc id="desc">A FastAPI request flows through middleware, dependency resolution, agent context, tool policy, model client, and observability.</desc>
  <rect width="1200" height="720" fill="#f7f4ee"/>
  <defs>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4b8b7e"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="70" y="68" font-size="34" font-weight="700" fill="#253238">FastAPI 作为 Agent Runtime 的 HTTP 外壳</text>
    <text x="70" y="106" font-size="18" fill="#5b6868">模型执行前，先把身份、权限、上下文、工具和观测边界装配好。</text>
    <g transform="translate(70 175)">
      <rect width="175" height="120" rx="16" fill="#fff" stroke="#73817f"/>
      <text x="88" y="58" text-anchor="middle" font-size="21" font-weight="700" fill="#253238">Request</text>
      <text x="88" y="87" text-anchor="middle" font-size="16" fill="#60706f">headers / body</text>
    </g>
    <g transform="translate(300 155)">
      <rect width="205" height="160" rx="16" fill="#eef6ee" stroke="#76a464" stroke-width="2"/>
      <text x="102" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#253238">Middleware</text>
      <text x="102" y="82" text-anchor="middle" font-size="16" fill="#60706f">request id</text>
      <text x="102" y="108" text-anchor="middle" font-size="16" fill="#60706f">trace context</text>
      <text x="102" y="134" text-anchor="middle" font-size="16" fill="#60706f">size guard</text>
    </g>
    <g transform="translate(565 155)">
      <rect width="245" height="160" rx="16" fill="#edf8f7" stroke="#49a9a2" stroke-width="2"/>
      <text x="122" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#253238">Dependencies</text>
      <text x="122" y="82" text-anchor="middle" font-size="16" fill="#60706f">user / workspace</text>
      <text x="122" y="108" text-anchor="middle" font-size="16" fill="#60706f">policy / budget</text>
      <text x="122" y="134" text-anchor="middle" font-size="16" fill="#60706f">tool registry</text>
    </g>
    <g transform="translate(870 155)">
      <rect width="250" height="160" rx="16" fill="#fff7dc" stroke="#d2a53a" stroke-width="2"/>
      <text x="125" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#253238">AgentContext</text>
      <text x="125" y="82" text-anchor="middle" font-size="16" fill="#60706f">allowed tools</text>
      <text x="125" y="108" text-anchor="middle" font-size="16" fill="#60706f">model / max steps</text>
      <text x="125" y="134" text-anchor="middle" font-size="16" fill="#60706f">run id / trace id</text>
    </g>
    <g stroke="#4b8b7e" stroke-width="3" marker-end="url(#arrow3)">
      <line x1="245" y1="235" x2="300" y2="235"/>
      <line x1="505" y1="235" x2="565" y2="235"/>
      <line x1="810" y1="235" x2="870" y2="235"/>
    </g>
    <g transform="translate(190 420)">
      <rect width="220" height="120" rx="16" fill="#fff" stroke="#49a9a2"/>
      <text x="110" y="54" text-anchor="middle" font-size="22" font-weight="700" fill="#253238">Agent Runner</text>
      <text x="110" y="86" text-anchor="middle" font-size="16" fill="#60706f">plan / act / observe</text>
    </g>
    <g transform="translate(490 410)">
      <rect width="220" height="140" rx="16" fill="#fff" stroke="#d2a53a"/>
      <text x="110" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#253238">Tools</text>
      <text x="110" y="82" text-anchor="middle" font-size="16" fill="#60706f">MCP / search</text>
      <text x="110" y="108" text-anchor="middle" font-size="16" fill="#60706f">approval gates</text>
    </g>
    <g transform="translate(790 410)">
      <rect width="220" height="140" rx="16" fill="#fff" stroke="#73817f"/>
      <text x="110" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#253238">Observability</text>
      <text x="110" y="82" text-anchor="middle" font-size="16" fill="#60706f">spans / events</text>
      <text x="110" y="108" text-anchor="middle" font-size="16" fill="#60706f">cost / errors</text>
    </g>
    <g stroke="#4b8b7e" stroke-width="3" marker-end="url(#arrow3)">
      <path d="M995 315 C995 370 300 360 300 420" fill="none"/>
      <line x1="410" y1="480" x2="490" y2="480"/>
      <line x1="710" y1="480" x2="790" y2="480"/>
    </g>
  </g>
</svg>
