<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Dependency chain and agent chain</title>
  <desc id="desc">FastAPI dependency chain resolves resources and permissions before the agent execution chain performs model and tool work.</desc>
  <rect width="1200" height="680" fill="#f8f5ee"/>
  <defs>
    <marker id="arrow4" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4b8b7e"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="70" y="70" font-size="34" font-weight="700" fill="#253238">两条链：先装配上下文，再执行 Agent</text>
    <g transform="translate(70 130)">
      <rect width="1060" height="190" rx="18" fill="#edf8f7" stroke="#49a9a2" stroke-width="2"/>
      <text x="28" y="45" font-size="25" font-weight="700" fill="#253238">FastAPI dependency chain</text>
      <g transform="translate(45 80)" font-size="17" fill="#253238">
        <rect width="140" height="70" rx="12" fill="#fff" stroke="#49a9a2"/><text x="70" y="42" text-anchor="middle">Header</text>
        <rect x="185" width="140" height="70" rx="12" fill="#fff" stroke="#49a9a2"/><text x="255" y="42" text-anchor="middle">User</text>
        <rect x="370" width="140" height="70" rx="12" fill="#fff" stroke="#49a9a2"/><text x="440" y="42" text-anchor="middle">Policy</text>
        <rect x="555" width="150" height="70" rx="12" fill="#fff" stroke="#49a9a2"/><text x="630" y="42" text-anchor="middle">Tool Set</text>
        <rect x="750" width="190" height="70" rx="12" fill="#fff7dc" stroke="#d2a53a"/><text x="845" y="42" text-anchor="middle">AgentContext</text>
      </g>
    </g>
    <g transform="translate(70 390)">
      <rect width="1060" height="190" rx="18" fill="#fff8de" stroke="#d2a53a" stroke-width="2"/>
      <text x="28" y="45" font-size="25" font-weight="700" fill="#253238">Agent execution chain</text>
      <g transform="translate(45 80)" font-size="17" fill="#253238">
        <rect width="140" height="70" rx="12" fill="#fff" stroke="#d2a53a"/><text x="70" y="42" text-anchor="middle">Prompt</text>
        <rect x="185" width="140" height="70" rx="12" fill="#fff" stroke="#d2a53a"/><text x="255" y="42" text-anchor="middle">Model</text>
        <rect x="370" width="140" height="70" rx="12" fill="#fff" stroke="#d2a53a"/><text x="440" y="42" text-anchor="middle">Tool Call</text>
        <rect x="555" width="150" height="70" rx="12" fill="#fff" stroke="#d2a53a"/><text x="630" y="42" text-anchor="middle">Retry</text>
        <rect x="750" width="190" height="70" rx="12" fill="#fff" stroke="#d2a53a"/><text x="845" y="42" text-anchor="middle">Final Result</text>
      </g>
    </g>
    <g stroke="#4b8b7e" stroke-width="3" marker-end="url(#arrow4)">
      <line x1="255" y1="245" x2="300" y2="245"/>
      <line x1="440" y1="245" x2="485" y2="245"/>
      <line x1="625" y1="245" x2="670" y2="245"/>
      <line x1="820" y1="245" x2="865" y2="245"/>
      <path d="M915 280 C980 325 980 375 915 425" fill="none"/>
      <line x1="255" y1="505" x2="300" y2="505"/>
      <line x1="440" y1="505" x2="485" y2="505"/>
      <line x1="625" y1="505" x2="670" y2="505"/>
      <line x1="820" y1="505" x2="865" y2="505"/>
    </g>
  </g>
</svg>
