<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AI engineering practice layer map</title>
  <desc id="desc">A layered map from user workflow to model, context, tools, evaluation, and governance.</desc>
  <rect width="1200" height="700" fill="#f7f4ee"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="72" font-size="34" font-weight="700" fill="#253238">AI 工程实践分层地图</text>
    <text x="80" y="112" font-size="18" fill="#5b6868">先判断问题属于哪一层，再选择模型、协议、Skill 或 Agent。</text>
    <g transform="translate(80 165)">
      <rect width="1040" height="78" rx="12" fill="#e8f1ed" stroke="#4c8f7a" stroke-width="2"/>
      <text x="28" y="48" font-size="24" font-weight="700" fill="#253238">1. 任务与用户工作流</text>
      <text x="360" y="48" font-size="18" fill="#52605f">目标、输入、输出、验收标准、人工节点</text>
    </g>
    <g transform="translate(80 265)">
      <rect width="1040" height="78" rx="12" fill="#fff8e7" stroke="#c9982e" stroke-width="2"/>
      <text x="28" y="48" font-size="24" font-weight="700" fill="#253238">2. 上下文与知识</text>
      <text x="360" y="48" font-size="18" fill="#52605f">文件、检索、记忆、来源、引用、时效边界</text>
    </g>
    <g transform="translate(80 365)">
      <rect width="1040" height="78" rx="12" fill="#eef1f3" stroke="#69767b" stroke-width="2"/>
      <text x="28" y="48" font-size="24" font-weight="700" fill="#253238">3. 工具、协议与 Skills</text>
      <text x="360" y="48" font-size="18" fill="#52605f">MCP、函数工具、脚本、Skill、AGENTS.md、权限边界</text>
    </g>
    <g transform="translate(80 465)">
      <rect width="1040" height="78" rx="12" fill="#eaf0f7" stroke="#5b7896" stroke-width="2"/>
      <text x="28" y="48" font-size="24" font-weight="700" fill="#253238">4. Agent Harness</text>
      <text x="360" y="48" font-size="18" fill="#52605f">计划、审批、日志、停止条件、回放、成本上限</text>
    </g>
    <g transform="translate(80 565)">
      <rect width="1040" height="78" rx="12" fill="#f5ece8" stroke="#b56f4b" stroke-width="2"/>
      <text x="28" y="48" font-size="24" font-weight="700" fill="#253238">5. 评测与运营</text>
      <text x="360" y="48" font-size="18" fill="#52605f">回归集、事实核验、UI QA、发布守门、读者反馈</text>
    </g>
  </g>
</svg>
