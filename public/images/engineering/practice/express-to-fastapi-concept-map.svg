<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Express concepts mapped to FastAPI concepts</title>
  <desc id="desc">A side by side map from Express routing, middleware, request body, errors, and npm workflow to FastAPI router, dependencies, Pydantic models, HTTPException, and uv workflow.</desc>
  <rect width="1200" height="720" fill="#f8f5ee"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#3f7f73"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="70" y="66" font-size="34" font-weight="700" fill="#223233">Express 经验如何迁移到 FastAPI</text>
    <text x="70" y="104" font-size="18" fill="#5d6968">保留 Web 后端直觉，但把“请求对象中心”换成“函数签名 + 类型 + 依赖链”。</text>
    <g transform="translate(70 150)">
      <rect width="455" height="500" rx="16" fill="#f0f8ed" stroke="#8ab55f" stroke-width="2"/>
      <text x="28" y="46" font-size="28" font-weight="700" fill="#26332d">Express / Node.js</text>
      <g font-size="20" fill="#26332d">
        <text x="34" y="108">Router</text>
        <text x="34" y="178">Middleware chain</text>
        <text x="34" y="248">req.params / req.body</text>
        <text x="34" y="318">res.json / next(err)</text>
        <text x="34" y="388">Promise / Promise.all</text>
        <text x="34" y="458">package.json / npm scripts</text>
      </g>
    </g>
    <g transform="translate(675 150)">
      <rect width="455" height="500" rx="16" fill="#edf8f7" stroke="#49a9a2" stroke-width="2"/>
      <text x="28" y="46" font-size="28" font-weight="700" fill="#26333a">FastAPI / Python</text>
      <g font-size="20" fill="#26333a">
        <text x="34" y="108">APIRouter</text>
        <text x="34" y="178">Middleware + Depends</text>
        <text x="34" y="248">函数参数 + Pydantic model</text>
        <text x="34" y="318">return + HTTPException</text>
        <text x="34" y="388">coroutine / asyncio.gather</text>
        <text x="34" y="458">pyproject.toml / uv run</text>
      </g>
    </g>
    <g stroke="#3f7f73" stroke-width="3" marker-end="url(#arrow)" opacity="0.9">
      <line x1="525" y1="255" x2="675" y2="255"/>
      <line x1="525" y1="325" x2="675" y2="325"/>
      <line x1="525" y1="395" x2="675" y2="395"/>
      <line x1="525" y1="465" x2="675" y2="465"/>
      <line x1="525" y1="535" x2="675" y2="535"/>
      <line x1="525" y1="605" x2="675" y2="605"/>
    </g>
    <rect x="460" y="135" width="280" height="52" rx="26" fill="#fff8d8" stroke="#d2a53a" stroke-width="2"/>
    <text x="600" y="169" text-anchor="middle" font-size="19" font-weight="700" fill="#533f13">迁移重点：边界声明</text>
  </g>
</svg>
