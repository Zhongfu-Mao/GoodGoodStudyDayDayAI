<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="940" viewBox="0 0 1400 940" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ADK agent project anatomy</title>
  <desc id="desc">A diagram showing how an ADK agent project is organized around root agent, model, tools, state, runtime, evaluation, and deployment.</desc>
  <rect width="1400" height="940" rx="36" fill="#f8fafc"/>
  <rect x="54" y="50" width="1292" height="840" rx="32" fill="#ffffff" stroke="#dbe3ea"/>
  <text x="96" y="120" fill="#0f172a" font-size="34" font-weight="760" font-family="Avenir Next, Segoe UI, sans-serif">ADK agent project anatomy</text>
  <text x="96" y="162" fill="#475569" font-size="20" font-family="Avenir Next, Segoe UI, sans-serif">最小 Agent 不是一段 Prompt，而是一组可被运行、审计和逐步部署的边界。</text>
  <g font-family="Avenir Next, Segoe UI, sans-serif">
    <rect x="120" y="232" width="320" height="152" rx="24" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="150" y="282" fill="#1d4ed8" font-size="25" font-weight="760">root_agent</text>
    <text x="150" y="326" fill="#0f172a" font-size="20">instruction</text>
    <text x="150" y="358" fill="#0f172a" font-size="20">model selection</text>
    <rect x="540" y="232" width="320" height="152" rx="24" fill="#dcfce7" stroke="#86efac"/>
    <text x="570" y="282" fill="#166534" font-size="25" font-weight="760">tools</text>
    <text x="570" y="326" fill="#0f172a" font-size="20">functions / MCP</text>
    <text x="570" y="358" fill="#0f172a" font-size="20">read or write scope</text>
    <rect x="960" y="232" width="320" height="152" rx="24" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="990" y="282" fill="#92400e" font-size="25" font-weight="760">state</text>
    <text x="990" y="326" fill="#0f172a" font-size="20">session</text>
    <text x="990" y="358" fill="#0f172a" font-size="20">artifacts / memory</text>
    <rect x="120" y="504" width="320" height="152" rx="24" fill="#fce7f3" stroke="#f9a8d4"/>
    <text x="150" y="554" fill="#9d174d" font-size="25" font-weight="760">runtime</text>
    <text x="150" y="598" fill="#0f172a" font-size="20">adk web / api server</text>
    <text x="150" y="630" fill="#0f172a" font-size="20">local test surface</text>
    <rect x="540" y="504" width="320" height="152" rx="24" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="570" y="554" fill="#5b21b6" font-size="25" font-weight="760">checks</text>
    <text x="570" y="598" fill="#0f172a" font-size="20">evalset / logs</text>
    <text x="570" y="630" fill="#0f172a" font-size="20">human review</text>
    <rect x="960" y="504" width="320" height="152" rx="24" fill="#ccfbf1" stroke="#5eead4"/>
    <text x="990" y="554" fill="#0f766e" font-size="25" font-weight="760">deployment path</text>
    <text x="990" y="598" fill="#0f172a" font-size="20">Agent Engine</text>
    <text x="990" y="630" fill="#0f172a" font-size="20">Cloud Run later</text>
  </g>
  <path d="M440 308H540M860 308H960M280 384V504M700 384V504M1120 384V504M440 580H540M860 580H960" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
  <rect x="180" y="752" width="1040" height="66" rx="20" fill="#0f172a"/>
  <text x="218" y="793" fill="#f8fafc" font-size="22" font-family="Avenir Next, Segoe UI, sans-serif">Rule of thumb: every box needs an owner, a failure mode, and a log you can inspect.</text>
</svg>
