<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Google Advent of Agents learning route cover</title>
  <desc id="desc">Editorial cover for a Google Cloud agent engineering learning route, showing an agent system moving from local development to production operations.</desc>
  <defs>
